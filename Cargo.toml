[package]
name = "webspice"
version = "0.1.0"
edition = "2021"
description = "Parser library for LTspice .asc schematic files"

# `cdylib` für den wasm32-Build (wasm-pack), `rlib` damit die Library
# weiterhin normal aus Rust konsumierbar bleibt.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
